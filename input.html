<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Absensi - JURU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div class="bg-dark text-white p-3" style="min-width: 250px; min-height: 100vh;">
            <h4 class="text-center mb-4">AYO BERMIMPI X JURU Admin</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white">
                        <i class="fa-solid fa-users me-2"></i> List Absensi
                    </a>
                </li>
                <li class="nav-item">
                    <a href="input.html" class="nav-link text-white active bg-primary rounded">
                        <i class="fa-solid fa-user-plus me-2"></i> Input Absensi
                    </a>
                </li>
            </ul>
        </div>

        <div class="w-100 p-4">
            <div class="mb-4">
                <h2>Form Input Absensi Karyawan</h2>
                <p class="text-muted">Silahkan isi data absensi karyawan dengan lengkap.</p>
            </div>

            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i> Data Absensi</h5>
                </div>
                <div class="card-body">
                    <form id="attendanceForm" onsubmit="saveAttendance(event)">
                        <div class="mb-3">
                            <label for="nama" class="form-label fw-semibold">Nama Karyawan</label>
                            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="alamat" class="form-label fw-semibold">Alamat</label>
                            <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat tinggal"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Jenis Kelamin</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderL"
                                        value="Laki-laki" checked>
                                    <label class="form-check-label" for="genderL">Laki-laki</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderP"
                                        value="Perempuan">
                                    <label class="form-check-label" for="genderP">Perempuan</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tanggal" class="form-label fw-semibold">Tanggal Absen</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="jamMasuk" class="form-label fw-semibold">Jam Masuk</label>
                                <input type="time" class="form-control" id="jamMasuk" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="jamKeluar" class="form-label fw-semibold">Jam Keluar</label>
                                <input type="time" class="form-control" id="jamKeluar" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-4">
                            <a href="index.html" class="btn btn-secondary">Batal</a>
                            <button type="submit" class="btn btn-success px-4">Simpan Data</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      
        document.getElementById('tanggal').valueToDate = new Date().toISOString().substring(0, 10);
    </script>
</body>

</html>
