<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Absensi - JURU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div class="bg-dark text-white p-3" style="min-width: 250px; min-height: 100vh;">
            <h4 class="text-center mb-4">AYO BERMIMPI X JURU Admin</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white active bg-primary rounded">
                        <i class="fa-solid fa-users me-2"></i> List Absensi
                    </a>
                </li>
                <li class="nav-item">
                    <a href="input.html" class="nav-link text-white">
                        <i class="fa-solid fa-user-plus me-2"></i> Input Absensi
                    </a>
                </li>
            </ul>
        </div>

        <div class="w-100 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Daftar Absensi Karyawan</h2>
                <a href="input.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Tambah Absen
                </a>
            </div>

            <div class="card mb-3 shadow-sm">
                <div class="card-body d-flex justify-content-end align-items-center gap-2">
                    <label for="sortBy" class="fw-bold text-secondary mb-0">Sort By:</label>
                    <select id="sortBy" class="form-select w-auto" onchange="sortData()">
                        <option value="nama-asc">Nama (A-Z)</option>
                        <option value="nama-desc">Nama (Z-A)</option>
                        <option value="tanggal-desc">Tanggal Terbaru</option>
                        <option value="tanggal-asc">Tanggal Terlama</option>
                    </select>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nama</th>
                                    <th>Alamat</th>
                                    <th>Jenis Kelamin</th>
                                    <th>Tanggal</th>
                                    <th>Jam Masuk</th>
                                    <th>Jam Keluar</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="employeeTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <nav class="mt-3">
                <ul class="pagination justify-content-center" id="paginationContainer">
                </ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Data Absensi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Nama</label>
                            <input type="text" id="editNama" class="form-滿足 form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alamat</label>
                            <textarea id="editAlamat" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Kelamin</label>
                            <select id="editGender" class="form-select" required>
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tanggal Absen</label>
                            <input type="date" id="editTanggal" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Jam Masuk</label>
                                <input type="time" id="editJamMasuk" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Jam Keluar</label>
                                <input type="time" id="editJamKeluar" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
       
        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });
    </script>
</body>

</html>
